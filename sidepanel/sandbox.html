<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sidecode Sandbox</title>
</head>
<body>
  <script>
    (function() {
      'use strict';

      function formatValue(val, depth, seen) {
        if (depth === undefined) depth = 0;
        if (!seen) seen = new WeakSet();

        if (val === null) return 'null';
        if (val === undefined) return 'undefined';
        if (typeof val === 'number' || typeof val === 'boolean') return String(val);
        if (typeof val === 'bigint') return val.toString() + 'n';
        if (typeof val === 'symbol') return val.toString();
        if (typeof val === 'function') return '[Function: ' + (val.name || 'anonymous') + ']';
        if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
        if (val instanceof Date) return val.toISOString();
        if (val instanceof RegExp) return val.toString();

        if (typeof val === 'string') {
          return depth === 0 ? val : JSON.stringify(val);
        }

        if (typeof val === 'object') {
          if (seen.has(val)) return '[Circular]';
          seen.add(val);

          if (Array.isArray(val)) {
            if (val.length === 0) return '[]';
            const items = val.map(function(item) { return formatValue(item, depth + 1, seen); });
            const oneLine = '[ ' + items.join(', ') + ' ]';
            if (oneLine.length <= 100 && !oneLine.includes('\n')) {
              return oneLine;
            }
            const indent = '  '.repeat(depth + 1);
            const closeIndent = '  '.repeat(depth);
            return '[\n' + items.map(function(i) { return indent + i; }).join(',\n') + '\n' + closeIndent + ']';
          }

          if (val instanceof Set) {
            const items = Array.from(val).map(function(item) { return formatValue(item, depth + 1, seen); });
            return 'Set(' + val.size + ') { ' + items.join(', ') + ' }';
          }

          if (val instanceof Map) {
            const entries = Array.from(val.entries()).map(function(pair) {
              return formatValue(pair[0], depth + 1, seen) + ' => ' + formatValue(pair[1], depth + 1, seen);
            });
            return 'Map(' + val.size + ') { ' + entries.join(', ') + ' }';
          }

          const keys = Object.keys(val);
          const protoPrefix = val.constructor && val.constructor.name !== 'Object' ? val.constructor.name + ' ' : '';
          if (keys.length === 0) {
            return protoPrefix + '{}';
          }

          const entries = keys.map(function(k) {
            const keyStr = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
            return keyStr + ': ' + formatValue(val[k], depth + 1, seen);
          });

          const oneLine = protoPrefix + '{ ' + entries.join(', ') + ' }';
          if (oneLine.length <= 100 && !oneLine.includes('\n')) {
            return oneLine;
          }

          const indent = '  '.repeat(depth + 1);
          const closeIndent = '  '.repeat(depth);
          return protoPrefix + '{\n' + entries.map(function(e) { return indent + e; }).join(',\n') + '\n' + closeIndent + '}';
        }

        return String(val);
      }

      function serializeArg(arg) {
        return formatValue(arg, 0);
      }

      function serializeArgs(args) {
        return Array.from(args).map(function(arg) { return formatValue(arg, 0); }).join(' ');
      }

      window.addEventListener('message', async function(event) {
        const data = event.data;
        if (!data || data.action !== 'execute') return;

        const { code, runId } = data;
        const origin = '*';
        const startTime = performance.now();
        let hasError = false;

        function post(type, payload) {
          window.parent.postMessage(Object.assign({ __sidecode: true, runId: runId, type: type }, payload), origin);
        }

        // Intercept console
        const origConsole = {
          log: console.log.bind(console),
          info: console.info.bind(console),
          warn: console.warn.bind(console),
          error: console.error.bind(console),
          clear: console.clear.bind(console),
          table: console.table ? console.table.bind(console) : null
        };

        console.log = function() {
          origConsole.log.apply(console, arguments);
          post('output', { level: 'log', text: serializeArgs(arguments) });
        };
        console.info = function() {
          origConsole.info.apply(console, arguments);
          post('output', { level: 'info', text: serializeArgs(arguments) });
        };
        console.warn = function() {
          origConsole.warn.apply(console, arguments);
          post('output', { level: 'warn', text: serializeArgs(arguments) });
        };
        console.error = function() {
          hasError = true;
          origConsole.error.apply(console, arguments);
          post('output', { level: 'error', text: serializeArgs(arguments) });
        };
        console.clear = function() {
          origConsole.clear.apply(console, arguments);
          post('clear', {});
        };
        console.table = function(tableData) {
          if (origConsole.table) origConsole.table.apply(console, arguments);
          post('output', { level: 'log', text: serializeArg(tableData) });
        };

        const onWindowError = function(msg, url, line, col, error) {
          hasError = true;
          const text = error ? (error.stack || error.toString()) : (msg + (line ? ' (line ' + line + ')' : ''));
          post('output', { level: 'error', text: text });
          return true;
        };

        const onUnhandledRejection = function(e) {
          hasError = true;
          const reason = e.reason;
          const text = reason ? (reason.stack || reason.toString()) : 'Unhandled Promise Rejection';
          post('output', { level: 'error', text: text });
        };

        window.onerror = onWindowError;
        window.addEventListener('unhandledrejection', onUnhandledRejection);

        try {
          const companionFiles = data.files || {};
          const activeFilePath = (data.activeFilePath || '').replace(/\\/g, '/');
          const initialDir = activeFilePath.includes('/') ? activeFilePath.substring(0, activeFilePath.lastIndexOf('/')) : '';

          const vCache = {};
          function resolveRel(base, req) {
            const clean = String(req).replace(/\\/g, '/');
            if (!clean.startsWith('./') && !clean.startsWith('../')) return clean;
            const b = base ? base.split('/').filter(Boolean) : [];
            const parts = clean.split('/').filter(Boolean);
            for (let i = 0; i < parts.length; i++) {
              if (parts[i] === '.') continue;
              if (parts[i] === '..') {
                if (b.length > 0) b.pop();
              } else {
                b.push(parts[i]);
              }
            }
            return b.join('/');
          }

          function createRequireForDir(dir) {
            return function virtualRequire(relPath) {
              const target = resolveRel(dir, relPath);
              const clean = target.replace(/^(\.\/|\/)/, '');
              const baseName = clean.split('/').pop();
              const cands = [
                clean,
                clean + '.js',
                clean + '/index.js',
                String(relPath).replace(/^(\.\/|\/)/, ''),
                String(relPath).replace(/^(\.\/|\/)/, '') + '.js',
                baseName,
                baseName + '.js'
              ];
              for (let ci = 0; ci < cands.length; ci++) {
                const c = cands[ci];
                for (const k in companionFiles) {
                  const normK = k.replace(/\\/g, '/');
                  if (normK === c || normK.endsWith('/' + c)) {
                    if (vCache[normK]) return vCache[normK].exports;
                    const subMod = { exports: {} };
                    vCache[normK] = subMod;
                    const subDir = normK.includes('/') ? normK.substring(0, normK.lastIndexOf('/')) : '';
                    const subRequire = createRequireForDir(subDir);
                    const subFn = new Function('module', 'exports', 'require', '__dirname', '__filename', companionFiles[k]);
                    subFn(subMod, subMod.exports, subRequire, subDir, normK);
                    return subMod.exports;
                  }
                }
              }
              throw new Error("Cannot find module '" + relPath + "' in workspace");
            };
          }

          const virtualRequire = createRequireForDir(initialDir);

          const mod = { exports: {} };
          // Execute asynchronously allowing top-level await if supported
          const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
          let fn;
          try {
            fn = new AsyncFunction('module', 'exports', 'require', '__dirname', '__filename', code);
          } catch (syntaxErr) {
            // Direct eval fallback for expressions
            fn = new AsyncFunction('module', 'exports', 'require', '__dirname', '__filename', 'return (' + code + ')');
          }
          const result = await fn(mod, mod.exports, virtualRequire, initialDir, activeFilePath);
          if (result !== undefined) {
            post('output', { level: 'result', text: serializeArg(result) });
          }
        } catch (err) {
          hasError = true;
          post('output', { level: 'error', text: err.stack || (err.name + ': ' + err.message) });
        } finally {
          const duration = Math.round(performance.now() - startTime);
          post('done', { hasError: hasError, duration: duration });

          // Restore console
          console.log = origConsole.log;
          console.info = origConsole.info;
          console.warn = origConsole.warn;
          console.error = origConsole.error;
          console.clear = origConsole.clear;
          if (origConsole.table) console.table = origConsole.table;
          window.onerror = null;
          window.removeEventListener('unhandledrejection', onUnhandledRejection);
        }
      });

      // Signal to parent that sandbox is ready
      window.parent.postMessage({ __sidecode: true, type: 'sandbox-ready' }, '*');
    })();
  </script>
</body>
</html>
